      <h1 class="label">Brands</h1>
      <p>Zizi Donna works with brands her readers would find in her closet or her garage.</p>
      <p>Yes to natural fibers with published sourcing. To things made to be kept. To brands that photograph women past forty and strong features. To car and car-care companies that speak to women as owners.</p>
      <p>Not fast fashion, fillers, gray coverage, diets, giveaways, or speed on a public road.</p>
      <p>Last quarter: three million views on Instagram, from a million and seven hundred thousand people. Ninety-six in a hundred had not seen her before.</p>
      <p>Formats: one film across Instagram, TikTok and YouTube. A minute inside a long video. A film on one product alone. An automotive series. A page in the letter. The rate depends on the work and on how the film is used. Rate card on request.</p>
